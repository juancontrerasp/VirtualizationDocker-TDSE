version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web
    ports:
      - "8087:6000"
    depends_on:
      - db

  db:
    image: mongo:3.6.1
    container_name: db
    ports:
      - "27017:27017"
    volumes:
      - mongodb:/data/db
      - mongodb_config:/data/configdb
    command: mongod

volumes:
  mongodb:
  mongodb_config: